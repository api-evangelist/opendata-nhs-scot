apis:
  - aid: opendata-nhs-scot:catalog
    name: NHS Scotland Open Data CKAN Action API
    description: >-
      CKAN Action API for NHS Scotland Open Data, a consistent JSON-over-HTTP interface over a catalog of 104 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://www.opendata.nhs.scot/api/3/action/.
    humanURL: https://www.opendata.nhs.scot
