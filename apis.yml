aid: opendata-nhs-scot
name: NHS Scotland Open Data
description: >-
  NHS Scotland Open Data is a government agency open-data portal for United Kingdom running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 104 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
